spring:
  application:
    name: matchiq-backend
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

api:
  security:
    token:
      secret: ${JWT_SECRET:ndKEIcNdNYmnTvreZlf2RREo5v69tj2Yh3AeMTqIkys=}
  huggingface:
    api-key: ${HUGGINGFACE_API_KEY:}
    model: ${HUGGINGFACE_MODEL:Qwen/Qwen2.5-7B-Instruct}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
  supabase:
    url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:avatars}

matchiq:
  collection:
    cooldown-minutes: 45
    interval-hours: 6
    initial-delay-minutes: 5
