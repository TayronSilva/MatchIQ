spring:
  application:
    name: matchiq-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/matchiq_dev
    username: matchiq_admin
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
