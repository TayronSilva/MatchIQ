server:
  port: 8080

spring:
  application:
    name: matchiq-backend

api:
  security:
    token:
      secret: ${JWT_SECRET}
      expiration: 86400000
  huggingface:
    api-key: ${HUGGINGFACE_API_KEY:}
    model: ${HUGGINGFACE_MODEL:deepseek-ai/DeepSeek-V4-Flash-0731:baseten}

logging:
  level:
    root: WARN